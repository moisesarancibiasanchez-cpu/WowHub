name: ci-f0
# F0 baseline CI: valida HU_01 (inventario), HU_02 (mapeo) y HU_03 (Alembic+pytest)
# en cada cambio que toque los archivos del paquete F0.

on:
  pull_request:
    paths:
      - "app/f0_baseline/**"
      - "scripts/f0_baseline/**"
      - "tests/f0_baseline/**"
      - "docs/f0_baseline/**"
  push:
    branches: [main]
    paths:
      - "app/f0_baseline/**"
      - "scripts/f0_baseline/**"
      - "tests/f0_baseline/**"
      - "docs/f0_baseline/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f0:
    name: F0 baseline (HU_01 + HU_02 + HU_03)
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run F0 tests
        env:
          # Desactivar middleware pesado en CI (rate limit / audit) para que
          # los tests F0 no bloqueen con `reset_db` + drop_all.
          DATABASE_URL: sqlite:///:memory:
          SECRET_KEY: ci-secret-key-min-32-chars-ok-ci
          JWT_SECRET: ci-jwt-secret-min-32-chars-ok-ci
          RATE_LIMIT_ENABLED: "false"
          AUDIT_ENABLED: "false"
        run: |
          python -m pytest tests/f0_baseline/ -v --tb=short --color=yes

      - name: Run F0 pipeline (genera artefactos)
        env:
          DATABASE_URL: sqlite:///:memory:
          SECRET_KEY: ci-secret-key-min-32-chars-ok-ci
          JWT_SECRET: ci-jwt-secret-min-32-chars-ok-ci
          RATE_LIMIT_ENABLED: "false"
          AUDIT_ENABLED: "false"
        run: |
          python -m scripts.f0_baseline.validate_all

      - name: Verify artifacts exist
        run: |
          test -f reports/f0_baseline/window-functions.json
          test -f reports/f0_baseline/mapping.json
          test -f reports/f0_baseline/migrations.json
          echo "✓ Todos los artefactos F0 generados"

      - name: Upload F0 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: f0-baseline-report
          path: reports/f0_baseline/
          retention-days: 14
