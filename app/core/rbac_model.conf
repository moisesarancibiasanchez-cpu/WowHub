# HU_38 — RBAC Granular con Casbin
# Modelo RBAC con domains (multi-tenant) y grouping (g).
#
# request_definition: sub = role string (e.g. "role:OWNER")
#                     dom = tenant id (UUID o "*" para global)
#                     obj = recurso (e.g. "product", "order")
#                     act = acción (e.g. "read", "write", "delete")
#
# policy_definition:  p = [sub, dom, obj, act]  — reglas de permisos
#
# role_definition:    g = [sub, role]           — jerarquía
#                     g2 = [_, _]              — grouping secundario (reservado)
#
# policy_effect:      some(where (p.eft == allow))  — clásico allow-only
#
# matchers:           1) g(r.sub, p.sub, r.dom) — el sub del request hereda
#                          permisos del sub de la policy dentro del dominio
#                          (esto permite role:CASHIER -> role:STAFF en dom=tenant-X).
#                     2) keyMatch(r.dom, p.dom) — domains match con *
#                     3) keyMatch(r.obj, p.obj) — objetos match con *
#                     4) keyMatch(r.act, p.act) — acciones match con *
#
# NOTA: Casbin 1.43 usa SimpleEval — NO soporta property access (e.g.
# r.sub.role). Por eso el subject se pasa ya formateado como "role:OWNER".
#
# NOTA: usamos `keyMatch` (no `==`) para soportar wildcard "*". Sin
# keyMatch, una policy con `p.dom="*"` nunca matchearía `r.dom="tenant-uuid"`.
[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, dom, obj, act

[role_definition]
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub, r.dom) && keyMatch(r.dom, p.dom) && keyMatch(r.obj, p.obj) && keyMatch(r.act, p.act)