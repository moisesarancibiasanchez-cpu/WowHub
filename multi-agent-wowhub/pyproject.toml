[project]
name        = "wowhub-multi-agent"
version     = "1.1.0"
description = "WowHub Multi-Agent System v1.1.0 — 4 agentes especializados (Orchestrator, Researcher, Coder, Validator)"
readme      = "README.md"
requires-python = ">=3.10"
license     = {text = "MIT"}
authors     = [{name = "WowHub Team"}]
keywords    = ["multi-agent", "wowhub", "audit", "v134", "llm", "minimax"]

dependencies = [
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "loguru>=0.7.0",
    "tenacity>=8.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-asyncio>=0.21.0; python_version < '3.11'",
]
all = [
    "wowhub-multi-agent[dev]",
]

[project.scripts]
wowhub-agent = "main:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "state*"]
exclude = ["tests*", "workspace*"]

[tool.pytest.ini_options]
minversion    = "7.0"
asyncio_mode  = "auto"
testpaths     = ["tests"]
addopts       = "-v --tb=short --strict-markers"
markers       = [
    "asyncio: mark test as requiring asyncio",
    "slow: mark test as slow running",
    "e2e: mark test as end-to-end",
    "unit: mark test as unit test",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source   = ["agents", "state"]
branch   = true
omit     = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/venv/*",
]

[tool.coverage.report]
show_missing = true
skip_empty   = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
