{% extends "dashboard/base.html" %}
{% block dash_title %}Pedidos — WowHub{% endblock %}

{% block dash_content %}
<section class="container" style="padding: 40px 24px;">
  <div class="flex" style="justify-content: space-between; align-items: center; margin-bottom: 24px;">
    <h1 style="margin: 0;">Pedidos</h1>
    <div>
      <select id="status-filter" class="form-input" style="display: inline-block; width: auto;">
        <option value="">Todos los estados</option>
        <option value="pending">Pendientes</option>
        <option value="confirmed">Confirmados</option>
        <option value="preparing">Preparando</option>
        <option value="ready">Listos</option>
        <option value="delivered">Entregados</option>
        <option value="canceled">Cancelados</option>
      </select>
      <button class="btn" id="refresh-btn">Actualizar</button>
    </div>
  </div>

  <div id="alert"></div>
  <div id="orders-list" class="card">
    <p class="text-muted text-center" style="padding: 40px;">Cargando…</p>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
let currentTenantId = null;

async function loadOrders() {
  const status = document.getElementById("status-filter").value;
  const memberships = await WH.api.get("/api/v1/me/memberships");
  if (!memberships.length) {
    document.getElementById("orders-list").innerHTML =
      '<p class="text-muted text-center" style="padding:40px;">No perteneces a ningún tenant.</p>';
    return;
  }
  currentTenantId = memberships[0].tenant_id;
  const params = new URLSearchParams();
  if (status) params.set("status", status);
  params.set("page_size", "100");
  const url = `/api/v1/tenants/${currentTenantId}/orders?${params.toString()}`;
  // La API devuelve Page[OrderListItem] = {items, total, page, ...},
  // no un array plano. Extraemos .items con fallback defensivo.
  const data = await WH.api.get(url);
  const orders = Array.isArray(data) ? data : (data?.items || data?.data || []);
  if (!orders.length) {
    document.getElementById("orders-list").innerHTML =
      '<p class="text-muted text-center" style="padding:40px;">No hay pedidos.</p>';
    return;
  }
  // OrderListItem NO incluye items ni customer_phone en la lista
  // (solo en el detalle /orders/{id}). Usamos los campos que sí
  // expone: number, customer_name, customer_email, item_count.
  const rows = orders.map(o => {
    const num = o.number || o.order_number || (o.id || "").slice(0, 8);
    const contact = o.customer_email || o.customer_phone || "";
    const itemsLabel = o.item_count != null
      ? `${o.item_count} ${o.item_count === 1 ? "ítem" : "ítems"}`
      : "";
    return `
    <div class="card mb-2" style="padding: 16px;">
      <div class="flex" style="justify-content: space-between; align-items: start;">
        <div>
          <strong>${num}</strong> · ${o.customer_name || "—"}${contact ? " · " + contact : ""}
          <br><span class="text-dim" style="font-size: 12px;">${new Date(o.created_at).toLocaleString()}</span>
        </div>
        <div>
          <span class="badge">${o.status}</span>
          <strong>$${((o.total_cents || 0) / 100).toFixed(2)}</strong>
        </div>
      </div>
      <div class="mt-2 text-muted" style="font-size: 13px;">
        ${itemsLabel}${o.source ? " · fuente: " + o.source : ""}
      </div>
      <div class="mt-2 flex" style="gap: 8px;">
        ${nextTransitions(o.status).map(s =>
          `<button class="btn btn-sm" onclick="transition('${o.id}','${s}')">${s}</button>`).join("")}
        <button class="btn btn-sm" onclick="cancelOrder('${o.id}')">Cancelar</button>
      </div>
    </div>`;
  }).join("");
  document.getElementById("orders-list").innerHTML = rows;
}

function nextTransitions(status) {
  // OrderStatus es un str-enum con valores LOWERCASE
  // (Pydantic v2 es case-sensitive). Devolvemos los siguientes
  // estados en minúsculas para que el backend los acepte.
  const map = {
    pending: ["confirmed"],
    confirmed: ["preparing"],
    preparing: ["ready"],
    ready: ["delivered"],
  };
  return map[status] || [];
}

async function transition(orderId, toStatus) {
  try {
    // El schema OrderTransition espera {new_status, notes?},
    // no {to_status}.
    await WH.api.post(
      `/api/v1/tenants/${currentTenantId}/orders/${orderId}/transition`,
      { new_status: toStatus }
    );
    loadOrders();
  } catch (err) {
    document.getElementById("alert").innerHTML = `<div class="alert alert-error">${err.message}</div>`;
  }
}

async function cancelOrder(orderId) {
  if (!confirm("¿Cancelar este pedido?")) return;
  try {
    // /cancel acepta 'reason' como query param (no body).
    await WH.api.post(
      `/api/v1/tenants/${currentTenantId}/orders/${orderId}/cancel?reason=${encodeURIComponent("Cancelado desde panel")}`
    );
    loadOrders();
  } catch (err) {
    document.getElementById("alert").innerHTML = `<div class="alert alert-error">${err.message}</div>`;
  }
}

document.getElementById("status-filter").addEventListener("change", loadOrders);
document.getElementById("refresh-btn").addEventListener("click", loadOrders);
loadOrders();
</script>
{% endblock %}
