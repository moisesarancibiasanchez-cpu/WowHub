{% extends "base.html" %}
{% block title %}Restablecer contraseña — WowHub{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="card">
      <h1 style="font-size: 24px; margin-bottom: 4px;">Restablecer contraseña</h1>
      <p class="text-muted" style="margin-bottom: 24px;">
        Crea una nueva contraseña para tu cuenta.
      </p>

      <div id="alert"></div>

      <form id="reset-form">
        <input type="hidden" id="token" name="token" value="{{ token }}">
        <div class="form-group">
          <label class="form-label" for="password">Nueva contraseña <span class="req">*</span></label>
          <input class="form-input" type="password" id="password" name="password"
                 required minlength="8" autocomplete="new-password" placeholder="Mínimo 8 caracteres">
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm">Confirmar contraseña <span class="req">*</span></label>
          <input class="form-input" type="password" id="confirm" name="confirm"
                 required minlength="8" autocomplete="new-password" placeholder="Repite la contraseña">
        </div>
        <button class="btn btn-primary btn-block btn-lg" type="submit" id="submit-btn">
          Cambiar contraseña
        </button>
      </form>

      <p class="text-center text-muted mt-4" style="font-size: 13px;">
        <a href="/login">Volver a ingresar</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById("reset-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("submit-btn");
  const pwd = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;
  if (pwd !== confirm) {
    document.getElementById("alert").innerHTML =
      '<div class="alert alert-error">Las contraseñas no coinciden.</div>';
    return;
  }
  if (pwd.length < 8) {
    document.getElementById("alert").innerHTML =
      '<div class="alert alert-error">La contraseña debe tener al menos 8 caracteres.</div>';
    return;
  }
  btn.disabled = true; btn.textContent = "Cambiando...";
  document.getElementById("alert").innerHTML = "";
  try {
    await WH.api.post("/api/v1/auth/reset-password", {
      token: document.getElementById("token").value,
      password: pwd,
    });
    document.getElementById("alert").innerHTML =
      '<div class="alert alert-success">Contraseña cambiada. Ya puedes ingresar.</div>';
    setTimeout(() => location.href = "/login", 1500);
  } catch (err) {
    document.getElementById("alert").innerHTML =
      `<div class="alert alert-error">${err.message}</div>`;
    btn.disabled = false; btn.textContent = "Cambiar contraseña";
  }
});
</script>
{% endblock %}
