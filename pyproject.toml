[project]
name = "wowhub"
version = "0.2.0"
description = "WowHub — plataforma SaaS modular para PyMEs en LATAM (página, catálogo, QR, promociones, pedidos, pagos, reservas, multi-sucursal)"
authors = [{name = "WowHub Team"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.27",
    "alembic>=1.13.1",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0,<6",  # seguridad: hashing de passwords; sin passlib (incompatible con bcrypt 5.x)
    "email-validator>=2.1.0",
    "jinja2>=3.1.3",
    "itsdangerous>=2.1.2",
    "qrcode[pil]>=7.4.2",
    "python-slugify>=8.0.1",
    "httpx>=0.27.0",
    "tenacity>=8.2.3",
    "psycopg2-binary>=2.9.0",
    "psycopg[binary]>=3.1.0",
    "pillow>=10.2.0",                # validación de imágenes en uploads
    "python-dateutil>=2.8.2",        # parsing de fechas en CSV
    # ── Background jobs (HU_36) ──────────────────────────────────
    # FIX 2026-09-27: estas dependencias faltaban acá, por lo que CI
    # (`pip install -e ".[dev]"`) corría la suite SIN Celery ni Redis
    # importables y el 100% del código asíncrono quedaba sin ejercitar.
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
    # ── Observabilidad (HU_07) ───────────────────────────────────
    # Ídem: faltaban, por lo que OTel y Sentry nunca se cargaban en CI.
    "sentry-sdk[fastapi]>=2.0.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-instrumentation-fastapi>=0.47b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.47b0",
    "opentelemetry-exporter-otlp>=1.22.0",
    "prometheus-client>=0.19.0",
    "prometheus-fastapi-instrumentator>=7.0.0",  # expone /metrics
    # ── Storage S3/R2 (HU_37) ────────────────────────────────────
    # `boto3` sólo estaba en el Dockerfile, no en ningún manifiesto Python.
    "boto3>=1.34.0",
    "botocore>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "faker>=24.0.0",
    "resend>=0.7.0",                 # backend de email opcional
]
e2e = [
    "playwright>=1.42.0",
    "pytest-playwright>=0.4.4",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# FIX 2026-09-27: `packages = ["app"]` empacaba sólo el módulo raíz de `app`,
# excluyendo `app.api`, `app.models`, `app.services`, etc. del wheel.
packages = [
    "app",
    "app.api",
    "app.api.v1",
    "app.core",
    "app.f0_baseline",
    "app.i18n",
    "app.models",
    "app.schemas",
    "app.services",
    "app.tasks",
]

[tool.setuptools.package-data]
app = ["i18n/*.json", "templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "e2e: tests E2E con Playwright (requieren --base-url y un servidor vivo)",
    "slow: tests lentos (subprocess a alembic/pytest). Omitir con `-m 'not slow'`",
]
# Configuración de pytest-playwright
# Para correr E2E:
#   pip install -e ".[e2e]"
#   playwright install chromium
#   pytest tests/e2e -m e2e --base-url=https://wowhub-app.up.railway.app
# Si no se pasa --base-url, default a localhost:8000 (útil con `uvicorn app.main:app`).

[tool.ruff]
line-length = 100
target-version = "py311"
